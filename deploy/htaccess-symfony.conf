# >>> fortia front controller >>>
# Added by deploy/cpanel-update.sh, which swaps this block whenever deploy/htaccess-symfony.conf changes. Everything
# outside the markers is cPanel's (the PHP handler line) and is left as it is.
DirectoryIndex index.php
Options -MultiViews -Indexes

<IfModule mod_rewrite.c>
    RewriteEngine On

    # The console signs every API call with "Authorization: Bearer <JWT>"; Apache drops that header before PHP
    # (CGI, FastCGI, lsapi) unless it is handed on, and every signed-in request would then answer 401.
    RewriteCond %{HTTP:Authorization} .+
    RewriteRule ^ - [E=HTTP_AUTHORIZATION:%0]

    # The base path, so the rules work at a domain's root and in a subfolder alike.
    RewriteCond %{REQUEST_URI}::$0 ^(/.+)/(.*)::\2$
    RewriteRule .* - [E=BASE:%1]

    # /index.php/foo → /foo, so the front controller never shows up in a URL.
    RewriteCond %{ENV:REDIRECT_STATUS} =""
    RewriteRule ^index\.php(?:/(.*)|$) %{ENV:BASE}/$1 [R=301,L]

    # Like the dev nginx: index.php is the only PHP file the web may run.
    RewriteRule ^(?!index\.php$).+\.php$ - [R=404,L]

    # Real files (the UI build, bundle assets, images) are served as they are; everything else goes to Symfony.
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule ^ - [L]
    RewriteRule ^ %{ENV:BASE}/index.php [L]
</IfModule>

<IfModule mod_headers.c>
    # Production build files carry a content hash in their name (Encore versioning): they never change.
    <FilesMatch "\.[0-9a-f]{8,}\.(js|css|woff2?|svg|png|jpe?g|webp)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <Files "entrypoints.json">
        Header set Cache-Control "no-cache"
    </Files>
</IfModule>
# <<< fortia front controller <<<
