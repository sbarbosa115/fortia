server {
    listen 80;
    server_name _;
    root /app/public;
    client_max_body_size 520m;
    # Re-resolve "php" so a recreated php container is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    location /build/ {
        try_files $uri =404;
        # Dev builds keep the same file names (no content hash): the browser revalidates every time (a 304 when
        # unchanged), or it would run a stale chunk after a rebuild.
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_read_timeout 130s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
