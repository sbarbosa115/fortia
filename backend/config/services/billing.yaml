# Billing's own wiring (item billing): the payment gateway port → its adapter by PAYMENT_PROVIDER (fake | stripe), and
# the fake gateway's tables. The adapters read their own settings (STRIPE_*, SALES_LEAD_RECIPIENTS…) with #[Autowire]
# on their constructors, because services.yaml's App\ resource, loaded after this file, redefines every class.
doctrine:
    orm:
        mappings:
            BillingFakeGateway:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Billing/Infrastructure/Gateway/Fake/Model'
                prefix: 'App\Billing\Infrastructure\Gateway\Fake\Model'

services:
    App\Billing\Application\Port\PaymentGateway:
        factory: ['@App\Billing\Infrastructure\Gateway\PaymentGatewayFactory', 'create']
        arguments: ['%env(PAYMENT_PROVIDER)%']

    App\Billing\Application\Port\SimulatedGateway: '@App\Billing\Infrastructure\Gateway\Fake\FakePaymentGateway'
