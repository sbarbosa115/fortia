security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Console users, loaded by the email claim of the id token.
        app_users:
            id: App\Identity\Infrastructure\Security\SecurityUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|build)/
            security: false
        api:
            pattern: ^/api/
            stateless: true
            provider: app_users
            jwt:
                authenticator: app.console_jwt_authenticator
            entry_point: App\Shared\UI\Http\Security\JsonAuthenticationEntryPoint
        main:
            security: false

    # Routes are public unless they ask for a console user: a `Caller $caller` argument (see CallerValueResolver)
    # or #[IsGranted('IS_AUTHENTICATED')]. Admin-only routes use #[IsGranted('ROLE_ADMIN')].
    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
