# Every checkout (and every worktree) is its own Compose project, named after its folder. Only host ports can
# clash between them: a worktree sets its own in the gitignored .env next to this file (split.py start does it).
x-php: &php
  build: ./docker/php
  image: mappi-php:dev
  working_dir: /app
  volumes:
    - ./backend:/app
    # var/ and vendor/ live in volumes, not on the bind mount: on Docker Desktop (Windows/macOS) reading vendor/
    # through the mount made every request take ~20 s. The host keeps marker files in backend/vendor/bin
    # (scripts/stack.sh) so the skill's gate sees the tools; they run in the container.
    - php_var:/app/var
    - php_vendor:/app/vendor
  environment:
    # No per-request freshness checks (slow over the bind mount): the reloader service clears the cache on change.
    APP_DEBUG: "0"
    APP_URL: http://localhost:${HTTP_PORT:-8080}
    FRONTEND_URL: http://localhost:${HTTP_PORT:-8080}
    ADMIN_FRONTEND_URL: http://localhost:${HTTP_PORT:-8080}/console
  depends_on:
    database:
      condition: service_healthy

services:
  php:
    <<: *php

  worker:
    <<: *php
    command: php bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=256M -vv
    restart: unless-stopped

  # Dev only: clears the Symfony cache and restarts the worker when src/, config/, templates/ or translations/ change.
  reloader:
    <<: *php
    command: sh /usr/local/bin/dev-reload.sh
    volumes:
      - ./backend:/app
      - php_var:/app/var
      - php_vendor:/app/vendor
      - ./docker/php/dev-reload.sh:/usr/local/bin/dev-reload.sh:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 40

  node:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "[ -d node_modules/.bin ] || npm ci --no-audit --no-fund; npm run watch"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: [e2e]
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      E2E_BASE_URL: http://nginx
    command: npx playwright test
    depends_on:
      - nginx

volumes:
  db_data:
  php_var:
  php_vendor:
